[project]
name = "hospital-node"
version = "0.1.0"
description = "Hospital node: articles, facts, requirements and hub assertions for one hospital"
authors = [
    { name = "Borys Trehubenko", email = "borys.trehubenko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "equivalence-core",
    "fastapi>=0.141.1",
    "llm-client",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0.54",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
hospital-node = "hospital_node.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
equivalence-core = { workspace = true }
llm-client = { workspace = true }
