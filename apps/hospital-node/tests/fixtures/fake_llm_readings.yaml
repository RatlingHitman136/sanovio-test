# What the fake `normalize_article` answers per article name. Some answers are deliberately
# wrong, so the tests can show that the node's checks and the parsers catch them.
"Nitrilhandschuh Sensicare Ice blau L":
  category_code: generic_consumable
  facts:
    # Implied by the material: something only the model can add.
    - {attribute_key: latex_free, value: true, unit: null, quote: Nitrilhandschuh, confidence: 0.9}
"Verbandstoff-Wundversorgung-Set steril":
  category_code: generic_consumable
  facts: []
"Einmalspritze 10 ml Luer-Lock steril":
  category_code: syringe_single_use
  facts:
    # Wrong number: the parser's 10 ml must win.
    - {attribute_key: nominal_volume_ml, value: 12, unit: ml, quote: 10 ml, confidence: 0.6}
    - {attribute_key: single_use, value: true, unit: null, quote: Einmalspritze, confidence: 0.95}
"Infusionsbesteck Intrafix Safe":
