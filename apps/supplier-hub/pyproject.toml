[project]
name = "supplier-hub"
version = "0.1.0"
description = "Supplier hub: catalogs, search, assessments and the attribute registry"
authors = [
    { name = "Borys Trehubenko", email = "borys.trehubenko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "equivalence-core",
    "fastapi>=0.141.1",
    "llm-client",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.15.0",
    "typer>=0.27.2",
    "service-kit",
    "sqlalchemy>=2.0.54",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
supplier-hub = "supplier_hub.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
service-kit = { workspace = true }
equivalence-core = { workspace = true }
llm-client = { workspace = true }
