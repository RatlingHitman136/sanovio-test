<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" data-diagram-type="STATE" style="width:977px;height:658px;background:#FFFFFF;" width="977.396px" height="658.854px" viewBox="0 0 977 658" zoomAndPan="magnify" preserveAspectRatio="none" contentStyleType="text/css"><?plantuml 1.2026.8?><defs/><g font-family="sans-serif" lengthAdjust="spacing"><g class="title" data-source-line="3"><text x="74.843" y="28.476" fill="#000" font-size="18.333" textLength="819.745" font-weight="700" font-family="'DejaVu Sans'">Background job lifecycle at the hub (jobs.status); the node has no queue (D53)</text></g><g class="start_entity" data-qualified-name=".start." id="ent0001" data-source-line="6"><ellipse cx="477.28" cy="70.612" rx="11.458" ry="11.458" fill="#222" style="stroke:#222;stroke-width:1.146;"/></g><rect x="442.332" y="176.029" width="70.373" height="45.833" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.573;" rx="3.438" ry="3.438"/><text x="448.061" y="203.705" fill="#000" font-size="13.75" textLength="58.914" font-family="'DejaVu Sans'">QUEUED</text><rect x="318.582" y="335.299" width="76.643" height="45.833" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.573;" rx="3.438" ry="3.438"/><text x="324.311" y="362.976" fill="#000" font-size="13.75" textLength="65.185" font-family="'DejaVu Sans'">RUNNING</text><rect x="259.572" y="502.591" width="96.691" height="45.833" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.573;" rx="3.438" ry="3.438"/><text x="265.301" y="530.268" fill="#000" font-size="13.75" textLength="85.233" font-family="'DejaVu Sans'">SUCCEEDED</text><rect x="384.468" y="502.591" width="59.765" height="45.833" fill="#F1F1F1" style="stroke:#181818;stroke-width:0.573;" rx="3.438" ry="3.438"/><text x="390.197" y="530.268" fill="#000" font-size="13.75" textLength="48.306" font-family="'DejaVu Sans'">FAILED</text><g class="end_entity" data-qualified-name=".end." id="ent0012" data-source-line="14"><ellipse cx="370.718" cy="626.341" rx="12.604" ry="12.604" fill="none" style="stroke:#222;stroke-width:1.146;"/><ellipse cx="370.718" cy="626.341" rx="6.875" ry="6.875" fill="#222" style="stroke:#222;stroke-width:1.146;"/></g><g class="entity" data-qualified-name="GMN15" id="ent0016" data-source-line="18"><path d="M465.249,483.112 L465.249,520.924 L444.243,525.508 L465.249,530.091 L465.249,567.725 A3.438,3.438 0 0 0 468.686,571.162 L758.349,571.162 A3.438,3.438 0 0 0 761.787,567.725 L761.787,491.133 L750.329,479.674 L468.686,479.674 A3.438,3.438 0 0 0 465.249,483.112" style="stroke:#C9A227;stroke-width:0.573;" fill="#FFF8E1"/><path d="M750.329,479.674 L750.329,489.414 A1.719,1.719 0 0 0 752.047,491.133 L761.787,491.133 L750.329,479.674" style="stroke:#C9A227;stroke-width:0.573;" fill="#FFF8E1"/><text x="472.124" y="498.167" fill="#000" font-size="13.75" textLength="222.605" font-family="'DejaVu Sans'">A job carrying an assessment_id</text><text x="472.124" y="514.173" fill="#000" font-size="13.75" textLength="259.968" font-family="'DejaVu Sans'">(ASSESS, EXTRACT_ANSWERS): event</text><text x="472.124" y="530.178" fill="#000" font-size="13.75" textLength="272.476" font-family="'DejaVu Sans'">JOB_FAILED and the assessment moves</text><text x="472.124" y="546.184" fill="#000" font-size="13.75" textLength="225.807" font-family="'DejaVu Sans'">to FAILED; POST /retry enqueues</text><text x="472.124" y="562.19" fill="#000" font-size="13.75" textLength="102.964" font-family="'DejaVu Sans'">a new ASSESS.</text></g><g class="entity" data-qualified-name="GMN18" id="ent0019" data-source-line="26"><path d="M510.509,299.779 L510.509,416.403 A3.438,3.438 0 0 0 513.947,419.84 L967.14,419.84 A3.438,3.438 0 0 0 970.577,416.403 L970.577,307.799 L959.119,296.341 L741.71,296.341 L512.246,201.977 L732.543,296.341 L513.947,296.341 A3.438,3.438 0 0 0 510.509,299.779" style="stroke:#C9A227;stroke-width:0.573;" fill="#FFF8E1"/><path d="M959.119,296.341 L959.119,306.081 A1.719,1.719 0 0 0 960.837,307.799 L970.577,307.799 L959.119,296.341" style="stroke:#C9A227;stroke-width:0.573;" fill="#FFF8E1"/><text x="517.384" y="314.833" fill="#000" font-size="13.75" textLength="393.506" font-family="'DejaVu Sans'">The queue exists only at the hub (no node &lt;-> hub link).</text><text x="526.126" y="330.839" fill="#000" font-size="13.75" textLength="427.264" font-family="'DejaVu Sans'">Hub kinds: NORMALIZE_ITEM | ASSESS | EXTRACT_ANSWERS |</text><text x="526.126" y="346.845" fill="#000" font-size="13.75" textLength="313.336" font-family="'DejaVu Sans'">PROPOSE_ATTRIBUTE | REBUILD_PROJECTION</text><text x="526.126" y="362.851" fill="#000" font-size="13.75" textLength="311.429" font-family="'DejaVu Sans'">Runs in a thread of the API process, or alone:</text><text x="526.126" y="378.857" fill="#000" font-size="13.75" textLength="407.935" font-family="'DejaVu Sans'">`supplier-hub worker` (API with WORKER_ENABLED=false).</text><text x="526.126" y="394.863" fill="#000" font-size="13.75" textLength="251.837" font-family="'DejaVu Sans'">Tests drain the queue inline instead.</text><text x="526.126" y="410.869" fill="#000" font-size="13.75" textLength="384.651" font-family="'DejaVu Sans'">The node normalizes and rebuilds synchronously (D53).</text></g><g class="link" data-entity-1="ent0001" data-entity-2="ent0002" id="lnk3" data-link-type="dependency"><polygon points="477.28,175.751,481.863,165.439,477.28,170.022,472.697,165.439,477.28,175.751" fill="#37474F" style="stroke:#37474F;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M477.28,86.827 C477.28,107.823 477.28,144.141 477.28,170.022" style="stroke:#37474F;stroke-width:1.146;" fill="none"/><text x="575.962" y="121.27" fill="#000" font-size="12.604" textLength="55.229" font-family="'DejaVu Sans'">enqueue</text><text x="479.572" y="135.942" fill="#000" font-size="12.604" textLength="248.009" font-family="'DejaVu Sans'">(same transaction as the state change;</text><text x="482.88" y="150.614" fill="#000" font-size="12.604" textLength="241.393" font-family="'DejaVu Sans'">unique dedupe_key blocks duplicates)</text></g><g class="link" data-entity-1="ent0002" data-entity-2="ent0004" id="lnk5" data-link-type="dependency"><polygon points="318.255,354.838,308.298,349.528,312.541,354.428,307.641,358.671,318.255,354.838" fill="#37474F" style="stroke:#37474F;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M442.206,201.138 C348.43,204.295 97.343,215.238 72.801,242.487 C0,323.317 219.13,347.717 312.541,354.428" style="stroke:#37474F;stroke-width:1.146;" fill="none"/><text x="158.528" y="256.478" fill="#000" font-size="12.604" textLength="87.946" font-family="'DejaVu Sans'">worker claims</text><text x="75.093" y="271.15" fill="#000" font-size="12.604" textLength="254.816" font-family="'DejaVu Sans'">(conditional UPDATE, run_after &lt;= now)</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0006" id="lnk7" data-link-type="dependency"><polygon points="297.9,502.572,298.638,491.311,295.921,497.196,290.036,494.479,297.9,502.572" fill="#37474F" style="stroke:#37474F;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M332.848,381.329 C318.169,396.404 300.76,417.773 292.801,440.716 C285.743,461.062 289.601,480.031 295.921,497.196" style="stroke:#37474F;stroke-width:1.146;" fill="none"/><text x="295.093" y="454.707" fill="#000" font-size="12.604" textLength="101.886" font-family="'DejaVu Sans'">handler finished</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk8" data-link-type="dependency"><polygon points="442.185,202.158,431.358,198.974,436.506,202.913,432.566,208.06,442.185,202.158" fill="#37474F" style="stroke:#37474F;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M350.292,334.96 C344.213,310.056 338.823,269.536 358.113,242.487 C377.111,215.848 408.684,206.612 436.506,202.913" style="stroke:#37474F;stroke-width:1.146;" fill="none"/><text x="360.405" y="256.478" fill="#000" font-size="12.604" textLength="211.489" font-family="'DejaVu Sans'">error [attempts &lt; max_attempts]</text><text x="361.251" y="271.15" fill="#000" font-size="12.604" textLength="209.797" font-family="'DejaVu Sans'">run_after = now + growing delay</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0009" id="lnk10" data-link-type="dependency"><polygon points="411.738,502.265,414.87,491.423,410.956,496.589,405.789,492.675,411.738,502.265" fill="#37474F" style="stroke:#37474F;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M370.284,381.414 C379.382,397.374 391.047,419.738 398.218,440.716 C405.153,461.004 408.595,479.469 410.956,496.589" style="stroke:#37474F;stroke-width:1.146;" fill="none"/><text x="406.238" y="454.707" fill="#000" font-size="12.604" textLength="233.349" font-family="'DejaVu Sans'">error [attempts = max_attempts (3)]</text></g><g class="link" data-entity-1="ent0004" data-entity-2="ent0002" id="lnk11" data-link-type="dependency"><polygon points="512.436,205.714,521.309,212.687,517.99,207.12,523.558,203.801,512.436,205.714" fill="#37474F" style="stroke:#37474F;stroke-width:1.146;stroke-linejoin:miter;stroke-miterlimit:10;"/><path d="M395.653,339.089 C424.181,326.218 464.136,309 500.197,296.341 C532.143,285.127 553.086,302.704 573.53,275.716 C582.448,263.944 581.598,254.857 573.53,242.487 C560.064,221.84 539.588,212.585 517.99,207.12" style="stroke:#37474F;stroke-width:1.146;" fill="none"/><text x="594.012" y="256.478" fill="#000" font-size="12.604" textLength="98.747" font-family="'DejaVu Sans'">service startup:</text><text x="582.697" y="271.15" fill="#000" font-size="12.604" textLength="121.377" font-family="'DejaVu Sans'">stuck job requeued</text></g><g class="link" data-entity-1="ent0006" data-entity-2="ent0012" id="lnk13" data-link-type="dependency"><polygon points="362.732,613.709,361.096,602.543,359.671,608.867,353.347,607.442,362.732,613.709" fill="#37474F" style="stroke:#37474F;stroke-width: