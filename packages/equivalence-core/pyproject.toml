[project]
name = "equivalence-core"
version = "0.1.0"
description = "Shared domain library for the hospital node and the supplier hub"
authors = [
    { name = "Borys Trehubenko", email = "borys.trehubenko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=50.0.1",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
