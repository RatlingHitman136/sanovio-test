[project]
name = "llm-client"
version = "0.1.0"
description = "LLM client shared by the hospital node and the supplier hub: one interface, the Anthropic adapter and a fake"
authors = [
    { name = "Borys Trehubenko", email = "borys.trehubenko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=1.6.0",
    "jinja2>=3.1.6",
    "pydantic>=2.13.5",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
