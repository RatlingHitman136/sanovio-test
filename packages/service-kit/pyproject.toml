[project]
name = "service-kit"
version = "0.1.0"
description = "Plumbing shared by the hospital node and the supplier hub: database base, clock, credentials, error mapping"
authors = [
    { name = "Borys Trehubenko", email = "borys.trehubenko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "pwdlib[argon2]>=0.3.1",
    "sqlalchemy>=2.0.54",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"
