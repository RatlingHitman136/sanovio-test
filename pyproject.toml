[project]
name = "sanovio-workspace"
version = "0.1.0"
description = "Article Equivalence Loop prototype (uv workspace root)"
requires-python = ">=3.14"

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "apps/*", "tools/*"]

[dependency-groups]
dev = [
    "httpx2>=2.13.0",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Autogenerated migrations keep Alembic's one-column-per-line layout.
"**/alembic/versions/*.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = [
    "equivalence_core", "llm_client", "hospital_node", "supplier_hub", "demo_client", "node_fixtures",
]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = [
    "packages/equivalence-core/src",
    "packages/llm-client/src",
    "apps/hospital-node/src",
    "apps/supplier-hub/src",
    "tools/demo-client/src",
]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
# Directories whose uniquely named helper modules the tests import.
pythonpath = ["apps/hospital-node/tests"]
filterwarnings = [
    # Raised inside starlette's own test client (starlette 1.6 / anyio 4.15); nothing to fix on our side.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning:starlette.testclient",
]
testpaths = [
    "packages/equivalence-core/tests",
    "packages/llm-client/tests",
    "apps/hospital-node/tests",
    "apps/supplier-hub/tests",
    "tools/demo-client/tests",
]

[tool.importlinter]
root_packages = ["equivalence_core", "llm_client", "hospital_node", "supplier_hub", "demo_client"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Node, hub and demo client never import each other"
type = "independence"
modules = ["hospital_node", "supplier_hub", "demo_client"]

[[tool.importlinter.contracts]]
name = "The LLM client imports no app and no domain code"
type = "forbidden"
source_modules = ["llm_client"]
forbidden_modules = ["hospital_node", "supplier_hub", "demo_client", "equivalence_core"]

[[tool.importlinter.contracts]]
name = "Core imports no app and no web, database or LLM library"
type = "forbidden"
source_modules = ["equivalence_core"]
forbidden_modules = [
    "hospital_node", "supplier_hub", "demo_client", "llm_client", "fastapi", "sqlalchemy", "anthropic",
]

[[tool.importlinter.contracts]]
name = "Node imports no HTTP client (it never calls the hub)"
type = "forbidden"
source_modules = ["hospital_node"]
forbidden_modules = ["httpx", "requests"]

[[tool.importlinter.contracts]]
name = "Apps reach the Anthropic SDK only through llm_client"
type = "forbidden"
source_modules = ["hospital_node", "supplier_hub"]
forbidden_modules = ["anthropic"]
allow_indirect_imports = true
