[project]
name = "demo-client"
version = "0.1.0"
description = "Demo client: the purchaser/supplier bridge between node and hub"
authors = [
    { name = "Borys Trehubenko", email = "borys.trehubenko@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "equivalence-core",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "typer>=0.27.2",
]

[project.scripts]
demo-client = "demo_client.cli:app"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
equivalence-core = { workspace = true }
